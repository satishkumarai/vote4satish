<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Private stats</title>
<style>
  :root{
    --ice:#00BFFF;
    --ink:#0B2540;
    --ink-soft:#3E5C74;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#F7FBFD;color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;
  }
  .card{
    background:#fff;border-radius:20px;padding:36px 40px;box-shadow:0 20px 50px rgba(11,37,64,0.12);
    max-width:420px;width:100%;
  }
  h1{font-size:16px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:24px;}
  .stat-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #EEF4F8;}
  .stat-row:last-child{border-bottom:none;}
  .stat-label{font-size:14px;color:var(--ink-soft);font-weight:600;}
  .stat-value{font-size:22px;font-weight:800;color:var(--ink);}
  .note{margin-top:24px;font-size:12px;color:var(--ink-soft);line-height:1.5;}
</style>
</head>
<body>
  <div class="card">
    <h1>vote4satish — private stats</h1>
    <div class="stat-row"><span class="stat-label">Site visits</span><span class="stat-value" id="visitCount">—</span></div>
    <p class="note">Live count via "hits" (hits-app.vercel.app) — no signup required. Note: viewing this page also counts as a visit, since this free service has no read-only endpoint. Not true per-IP dedup — a static site can't see visitor IPs without a server.</p>
  </div>
  <script>
    fetch('https://hits-app.vercel.app/hits?url=' + encodeURIComponent('https://satishkumarai.github.io/vote4satish/') + '&json')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var val = data && (data.value !== undefined ? data.value : (data.hits !== undefined ? data.hits : data.total));
        document.getElementById('visitCount').textContent = (typeof val === 'number') ? val.toLocaleString() : '—';
      })
      .catch(function(){
        document.getElementById('visitCount').textContent = '—';
      });
  </script>
</body>
</html>
